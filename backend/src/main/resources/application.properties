spring.application.name=dayflowj
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./data/dayflowj
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# SMTP secrets are supplied through the local process environment, never committed.
dayflow.mail.host=${DAYFLOW_MAIL_HOST:}
dayflow.mail.port=${DAYFLOW_MAIL_PORT:587}
dayflow.mail.username=${DAYFLOW_MAIL_USERNAME:}
dayflow.mail.password=${DAYFLOW_MAIL_PASSWORD:}
dayflow.mail.from=${DAYFLOW_MAIL_FROM:}
dayflow.mail.ssl=${DAYFLOW_MAIL_SSL:false}

# The local installation has one verified account.
dayflow.public-url=${DAYFLOW_PUBLIC_URL:http://127.0.0.1:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
