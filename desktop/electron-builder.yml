appId: com.burcuduzen.dayflowj
productName: DayFlowJ
asar: true
directories:
  output: dist
files:
  - main.cjs
  - backend.cjs
  - diagnostics.cjs
  - diagnostics-preload.cjs
extraResources:
  - from: ../backend/target/dayflowj-0.0.1-SNAPSHOT.jar
    to: backend/target/dayflowj-0.0.1-SNAPSHOT.jar
  - from: jre-small
    to: desktop/jre
  - from: Read-Settings.ps1
    to: desktop/Read-Settings.ps1
win:
  target: nsis
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: DayFlowJ
  deleteAppDataOnUninstall: false
artifactName: DayFlowJ-Setup-${version}.${ext}
